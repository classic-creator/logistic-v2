name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >>~/.ssh/config <<END
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          END

      - name: Deploy Backend via Rsync
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='/vendor' \
            --exclude='/storage/logs' \
            --exclude='/bootstrap/cache' \
            --exclude='node_modules' \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            backend/ ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/home/u233320315/domains/maroon-rabbit-572992.hostingersite.com/backend/

      - name: Deploy Frontend via Rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.htaccess' \
            --exclude='/api' \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            dist/ ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/home/u233320315/domains/maroon-rabbit-572992.hostingersite.com/public_html/

      - name: Run Laravel Setup Commands
        run: |
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} << 'EOF'
            mkdir -p /home/u233320315/domains/maroon-rabbit-572992.hostingersite.com/backend
            cd /home/u233320315/domains/maroon-rabbit-572992.hostingersite.com/backend
            
            # Create .env if missing
            if [ ! -f ".env" ]; then
                cp .env.example .env
                php artisan key:generate
            fi
            
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            php artisan cache:clear
            php artisan optimize

            # Create Symlink for API
            cd /home/u233320315/domains/maroon-rabbit-572992.hostingersite.com/public_html
            if [ -L "api" ]; then rm "api"; elif [ -d "api" ]; then rm -rf "api"; fi
            ln -s ../backend/public api
            
            # Setup React Router .htaccess
            cat << 'HTACCESS' > .htaccess
            <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /
              RewriteRule ^index\.html$ - [L]
              RewriteCond %{REQUEST_URI} ^/api [NC]
              RewriteRule .* - [L]
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
            </IfModule>
            HTACCESS
          EOF
